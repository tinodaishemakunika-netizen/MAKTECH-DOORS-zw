<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakTech Doors - Premium Door Solutions</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
 
  <header>
    <div class="logo">MakTech Doors</div>
    <nav>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact Us</a>

  </header>
 
  <section class="hero">

    <p>Aluminium composite sliding gates, high-security garage doors, and custom entrances.</p>
    <a href="#gallery" class="btn">View Collection</a>
  </section>
 
  <section id="contact" class="contact-bar">
    <div><i class="fa-solid fa-phone"></i> <span id="displayPhone">+263 789 009 829</span></div>
    <div><i class="fa-solid fa-envelope"></i> <span id="displayEmail">info@maktechdoors.co.zw</span></div>
    <div><i class="fa-solid fa-calendar-days"></i> Next Install Date: <span id="displayAvailability">Available Now</span></div>

  <section id="gallery" class="gallery-container">
    <h2>Our Door Catalog</h2>
    <div id="doorsContainer" class="doors-grid"></div>

  <div id="doorModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>
 
  <a href="https://wa.me/263789009829?text=Hi%20MakTech%20Doors,%20I%20have%20an%20inquiry" target="_blank" class="float-wa">
    <i class="fa-brands fa-whatsapp"></i>

</html>
